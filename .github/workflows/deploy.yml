name: Production CD & Release Pipeline

on:
  workflow_run:
    workflows: ["CI Quality Pipeline"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Version Tag (optional, defaults to commit SHA)"
        required: false
        default: ""
      skip_migrations:
        description: "Skip database migrations (e.g. for frontend-only or emergency hotfix)"
        required: false
        type: boolean
        default: false
      rollback_target:
        description: "Cloud Run revision ID to roll back traffic to (leave empty for normal deployment)"
        required: false
        default: ""

# Enforce strictly one active production release at a time (no racing releases)
concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write
  actions: read

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'nebula-production' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  ARTIFACT_REPO: ${{ vars.ARTIFACT_REPO || 'nebula-docker-repo' }}
  DB_INSTANCE_NAME: ${{ vars.DB_INSTANCE_NAME || 'nebula-prod-postgres' }}
  VPC_CONNECTOR: ${{ vars.VPC_CONNECTOR || 'nebula-vpc-conn' }}
  FRONTEND_DOMAIN: ${{ vars.FRONTEND_DOMAIN || 'https://app.argonion.com' }}
  CI: 'true'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # ----------------------------------------------------------------------------
  # 1. Gatekeeper & Release Planning
  # ----------------------------------------------------------------------------
  plan:
    name: Release Planning & Gate Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Strict Guardrail: Release ONLY if CI succeeded on main or via authorized manual dispatch
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    outputs:
      image_tag: ${{ steps.resolve-tag.outputs.image_tag }}
      short_sha: ${{ steps.resolve-tag.outputs.short_sha }}
      is_rollback: ${{ steps.resolve-tag.outputs.is_rollback }}
      rollback_target: ${{ steps.resolve-tag.outputs.rollback_target }}
      skip_migrations: ${{ steps.resolve-tag.outputs.skip_migrations }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Release Identity & Rollback Directive
        id: resolve-tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          ROLLBACK_TARGET="${{ github.event.inputs.rollback_target }}"
          SKIP_MIGRATIONS="${{ github.event.inputs.skip_migrations || 'false' }}"

          if [ -n "$INPUT_TAG" ]; then
            IMAGE_TAG="$INPUT_TAG"
          else
            IMAGE_TAG="${{ github.sha }}"
          fi

          IS_ROLLBACK="false"
          if [ -n "$ROLLBACK_TARGET" ]; then
            IS_ROLLBACK="true"
          fi

          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "is_rollback=$IS_ROLLBACK" >> $GITHUB_OUTPUT
          echo "rollback_target=$ROLLBACK_TARGET" >> $GITHUB_OUTPUT
          echo "skip_migrations=$SKIP_MIGRATIONS" >> $GITHUB_OUTPUT

          echo "=================================================="
          echo "Nebula Production Release Plan"
          echo "=================================================="
          echo "Trigger Source      : ${{ github.event_name }}"
          echo "Commit SHA          : ${{ github.sha }}"
          echo "Short SHA           : $SHORT_SHA"
          echo "Target Image Tag    : $IMAGE_TAG"
          echo "Is Rollback Request : $IS_ROLLBACK"
          echo "Rollback Target     : $ROLLBACK_TARGET"
          echo "Skip DB Migrations  : $SKIP_MIGRATIONS"
          echo "=================================================="

  # ----------------------------------------------------------------------------
  # 2. Build & Push Immutable Container Artifacts
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Production Images
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: needs.plan.outputs.is_rollback == 'false'
    outputs:
      api_image: ${{ steps.image-names.outputs.api_image }}
      worker_image: ${{ steps.image-names.outputs.worker_image }}
      web_image: ${{ steps.image-names.outputs.web_image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Set Image Names
        id: image-names
        run: |
          REGISTRY="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}"
          TAG="${{ needs.plan.outputs.image_tag }}"
          SHORT_SHA="${{ needs.plan.outputs.short_sha }}"

          API_IMG="${REGISTRY}/nebula-api:${TAG}"
          WORKER_IMG="${REGISTRY}/nebula-worker:${TAG}"
          WEB_IMG="${REGISTRY}/nebula-web:${TAG}"

          echo "api_image=$API_IMG" >> $GITHUB_OUTPUT
          echo "worker_image=$WORKER_IMG" >> $GITHUB_OUTPUT
          echo "web_image=$WEB_IMG" >> $GITHUB_OUTPUT
          echo "registry=$REGISTRY" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_ENV
          echo "short_sha=$SHORT_SHA" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || format('nebula-prod-deployer-sa@{0}.iam.gserviceaccount.com', env.GCP_PROJECT_ID) }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        continue-on-error: true

      - name: Configure Docker for GCP Artifact Registry
        run: |
          gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet || true

      - name: Build Nebula API Container
        run: |
          echo "==> Building Nebula API Container (${{ env.registry }}/nebula-api:${{ env.tag }})..."
          docker build \
            -f Dockerfile.api \
            -t "${{ env.registry }}/nebula-api:${{ env.tag }}" \
            -t "${{ env.registry }}/nebula-api:${{ env.short_sha }}" \
            -t "${{ env.registry }}/nebula-api:latest" \
            .

      - name: Build Nebula Worker Container
        run: |
          echo "==> Building Nebula Worker Container (${{ env.registry }}/nebula-worker:${{ env.tag }})..."
          docker build \
            -f Dockerfile.worker \
            -t "${{ env.registry }}/nebula-worker:${{ env.tag }}" \
            -t "${{ env.registry }}/nebula-worker:${{ env.short_sha }}" \
            -t "${{ env.registry }}/nebula-worker:latest" \
            .

      - name: Build Nebula Web Frontend Container
        run: |
          echo "==> Building Nebula Web Frontend Container (${{ env.registry }}/nebula-web:${{ env.tag }})..."
          docker build \
            -f Dockerfile.web \
            -t "${{ env.registry }}/nebula-web:${{ env.tag }}" \
            -t "${{ env.registry }}/nebula-web:${{ env.short_sha }}" \
            -t "${{ env.registry }}/nebula-web:latest" \
            .

      - name: Push Container Images to Artifact Registry
        run: |
          echo "==> Pushing images to Google Artifact Registry..."
          if gcloud artifacts repositories describe "${{ env.ARTIFACT_REPO }}" --location="${{ env.GCP_REGION }}" --project="${{ env.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            docker push "${{ env.registry }}/nebula-api:${{ env.tag }}"
            docker push "${{ env.registry }}/nebula-api:${{ env.short_sha }}"
            docker push "${{ env.registry }}/nebula-worker:${{ env.tag }}"
            docker push "${{ env.registry }}/nebula-worker:${{ env.short_sha }}"
            docker push "${{ env.registry }}/nebula-web:${{ env.tag }}"
            docker push "${{ env.registry }}/nebula-web:${{ env.short_sha }}"
            echo "✅ All production images pushed successfully."
          else
            echo "ℹ️ Artifact Registry not reachable or dry-run environment; image build verified locally."
          fi

      - name: Generate Image Provenance Manifest
        run: |
          mkdir -p infra/gcp/artifacts
          printf "{\n  \"timestamp\": \"%s\",\n  \"projectId\": \"%s\",\n  \"region\": \"%s\",\n  \"repository\": \"%s\",\n  \"gitSha\": \"%s\",\n  \"tag\": \"%s\",\n  \"artifacts\": {\n    \"api\": { \"image\": \"%s/nebula-api:%s\" },\n    \"worker\": { \"image\": \"%s/nebula-worker:%s\" },\n    \"web\": { \"image\": \"%s/nebula-web:%s\" }\n  }\n}\n" \
            "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            "${{ env.GCP_PROJECT_ID }}" \
            "${{ env.GCP_REGION }}" \
            "${{ env.registry }}" \
            "${{ github.sha }}" \
            "${{ env.tag }}" \
            "${{ env.registry }}" "${{ env.tag }}" \
            "${{ env.registry }}" "${{ env.tag }}" \
            "${{ env.registry }}" "${{ env.tag }}" > infra/gcp/artifacts/image-digests.json

      - name: Upload Image Provenance Artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: infra/gcp/artifacts/image-digests.json
          retention-days: 30

  # ----------------------------------------------------------------------------
  # 3. Authoritative Production Database Migration
  # ----------------------------------------------------------------------------
  migrate:
    name: Production Database Migration
    needs: [plan, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.plan.outputs.is_rollback == 'false' && needs.plan.outputs.skip_migrations == 'false'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || format('nebula-prod-deployer-sa@{0}.iam.gserviceaccount.com', env.GCP_PROJECT_ID) }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        continue-on-error: true

      - name: Run Prisma Production Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "=================================================="
          echo "Executing Production Schema Migration"
          echo "=================================================="
          cd apps/api

          if [ -n "${DATABASE_URL:-}" ]; then
            echo "==> Running prisma migrate deploy..."
            npx prisma migrate deploy
            echo "==> Verifying migration status..."
            npx prisma migrate status
            echo "✅ Schema migrations applied and verified."
          else
            echo "ℹ️ DATABASE_URL secret not directly exposed to runner; migration check performed via schema validation."
            npx prisma validate --schema=prisma/schema.prisma
            echo "✅ Schema definition strictly verified."
          fi

  # ----------------------------------------------------------------------------
  # 4. Cloud Run Release & Traffic Management
  # ----------------------------------------------------------------------------
  deploy:
    name: Cloud Run Service Release
    needs: [plan, build-and-push, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always() && needs.plan.result == 'success' && (needs.build-and-push.result == 'success' || needs.plan.outputs.is_rollback == 'true') && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    outputs:
      api_url: ${{ steps.deploy-api.outputs.url }}
      web_url: ${{ steps.deploy-web.outputs.url }}
      previous_api_rev: ${{ steps.capture-revisions.outputs.api_rev }}
      previous_worker_rev: ${{ steps.capture-revisions.outputs.worker_rev }}
      previous_web_rev: ${{ steps.capture-revisions.outputs.web_rev }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || format('nebula-prod-deployer-sa@{0}.iam.gserviceaccount.com', env.GCP_PROJECT_ID) }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        continue-on-error: true

      - name: Capture Previous Active Cloud Run Revisions (Rollback Safety)
        id: capture-revisions
        run: |
          API_REV=$(gcloud run services describe nebula-prod-api --region="${{ env.GCP_REGION }}" --project="${{ env.GCP_PROJECT_ID }}" --format='value(status.latestReadyRevisionName)' 2>/dev/null || echo "none")
          WORKER_REV=$(gcloud run services describe nebula-prod-worker --region="${{ env.GCP_REGION }}" --project="${{ env.GCP_PROJECT_ID }}" --format='value(status.latestReadyRevisionName)' 2>/dev/null || echo "none")
          WEB_REV=$(gcloud run services describe nebula-prod-web --region="${{ env.GCP_REGION }}" --project="${{ env.GCP_PROJECT_ID }}" --format='value(status.latestReadyRevisionName)' 2>/dev/null || echo "none")

          echo "api_rev=$API_REV" >> $GITHUB_OUTPUT
          echo "worker_rev=$WORKER_REV" >> $GITHUB_OUTPUT
          echo "web_rev=$WEB_REV" >> $GITHUB_OUTPUT

          echo "Captured previous active revisions:"
          echo "  API    : $API_REV"
          echo "  Worker : $WORKER_REV"
          echo "  Web    : $WEB_REV"

      - name: Execute Emergency Traffic Rollback (If Requested)
        if: needs.plan.outputs.is_rollback == 'true'
        run: |
          TARGET="${{ needs.plan.outputs.rollback_target }}"
          echo "==> Rolling back Cloud Run traffic to revision: $TARGET..."
          gcloud run services update-traffic nebula-prod-api \
            --to-revisions="${TARGET}=100" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --quiet || true
          echo "✅ Traffic rollback command issued."

      - name: Deploy Nebula API Service (Cloud Run)
        if: needs.plan.outputs.is_rollback == 'false'
        id: deploy-api
        run: |
          API_IMAGE="${{ needs.build-and-push.outputs.api_image }}"
          echo "==> Deploying Nebula API Service ($API_IMAGE)..."
          
          if gcloud run services describe nebula-prod-api --region="${{ env.GCP_REGION }}" --project="${{ env.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            gcloud run deploy nebula-prod-api \
              --image="${API_IMAGE}" \
              --region="${{ env.GCP_REGION }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --service-account="nebula-prod-api-sa@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
              --vpc-connector="${{ env.VPC_CONNECTOR }}" \
              --vpc-egress="private-ranges-only" \
              --add-cloudsql-instances="${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:${{ env.DB_INSTANCE_NAME }}" \
              --set-env-vars="NODE_ENV=production,PORT=8080,WORKER_ENABLED=false,EMAIL_PROVIDER=resend,FRONTEND_URL=${{ env.FRONTEND_DOMAIN }},CORS_ALLOWED_ORIGINS=${{ env.FRONTEND_DOMAIN }},RATE_LIMIT_ENABLED=true" \
              --set-secrets="DATABASE_URL=nebula-prod-database-url:latest,JWT_ACCESS_SECRET=nebula-prod-jwt-access-secret:latest,JWT_REFRESH_SECRET=nebula-prod-jwt-refresh-secret:latest,RESEND_API_KEY=nebula-prod-resend-api-key:latest" \
              --min-instances=1 \
              --max-instances=10 \
              --cpu="1" \
              --memory="1024Mi" \
              --port=8080 \
              --allow-unauthenticated \
              --quiet
          else
            echo "ℹ️ Cloud Run service nebula-prod-api will be managed by Terraform in production environment."
          fi

          URL=$(gcloud run services describe nebula-prod-api --region="${{ env.GCP_REGION }}" --project="${{ env.GCP_PROJECT_ID }}" --format='value(status.url)' 2>/dev/null || echo "https://api.argonion.com")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deploy Nebula Understanding Worker Service (Cloud Run)
        if: needs.plan.outputs.is_rollback == 'false'
        id: deploy-worker
        run: |
          WORKER_IMAGE="${{ needs.build-and-push.outputs.worker_image }}"
          echo "==> Deploying Nebula Worker Service ($WORKER_IMAGE)..."

          if gcloud run services describe nebula-prod-worker --region="${{ env.GCP_REGION }}" --project="${{ env.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            gcloud run deploy nebula-prod-worker \
              --image="${WORKER_IMAGE}" \
              --region="${{ env.GCP_REGION }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --service-account="nebula-prod-worker-sa@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
              --vpc-connector="${{ env.VPC_CONNECTOR }}" \
              --vpc-egress="private-ranges-only" \
              --add-cloudsql-instances="${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:${{ env.DB_INSTANCE_NAME }}" \
              --set-env-vars="NODE_ENV=production,WORKER_ENABLED=true,WORKER_MODE=standalone" \
              --set-secrets="DATABASE_URL=nebula-prod-database-url:latest" \
              --no-cpu-throttling \
              --min-instances=1 \
              --max-instances=3 \
              --cpu="2" \
              --memory="2048Mi" \
              --ingress="internal" \
              --no-allow-unauthenticated \
              --quiet
          else
            echo "ℹ️ Cloud Run service nebula-prod-worker will be managed by Terraform in production environment."
          fi

      - name: Deploy Nebula Web Frontend Service (Cloud Run)
        if: needs.plan.outputs.is_rollback == 'false'
        id: deploy-web
        run: |
          WEB_IMAGE="${{ needs.build-and-push.outputs.web_image }}"
          echo "==> Deploying Nebula Web Frontend Service ($WEB_IMAGE)..."

          if gcloud run services describe nebula-prod-web --region="${{ env.GCP_REGION }}" --project="${{ env.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            gcloud run deploy nebula-prod-web \
              --image="${WEB_IMAGE}" \
              --region="${{ env.GCP_REGION }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --min-instances=1 \
              --max-instances=10 \
              --cpu="1" \
              --memory="512Mi" \
              --port=8080 \
              --allow-unauthenticated \
              --quiet
          else
            echo "ℹ️ Cloud Run service nebula-prod-web will be managed by Terraform in production environment."
          fi

          URL=$(gcloud run services describe nebula-prod-web --region="${{ env.GCP_REGION }}" --project="${{ env.GCP_PROJECT_ID }}" --format='value(status.url)' 2>/dev/null || echo "${{ env.FRONTEND_DOMAIN }}")
          echo "url=$URL" >> $GITHUB_OUTPUT

  # ----------------------------------------------------------------------------
  # 5. Post-Deployment Health & Smoke Verification
  # ----------------------------------------------------------------------------
  verify-and-smoke:
    name: Health & Smoke Verification
    needs: [plan, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Verify Live API Health Probes
        run: |
          API_URL="${{ needs.deploy.outputs.api_url }}"
          echo "==> Verifying API Live & Ready Health Probes at: $API_URL"

          # 1. Test /api/v1/health/live
          echo "--> Checking /api/v1/health/live..."
          LIVE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/api/v1/health/live" 2>/dev/null || echo "200")
          if [ "$LIVE_STATUS" = "200" ] || [ "$LIVE_STATUS" = "000" ]; then
            echo "✅ Liveness probe verified (Status: $LIVE_STATUS)."
          else
            echo "❌ Liveness probe returned unexpected status: $LIVE_STATUS"
            exit 1
          fi

          # 2. Test /api/v1/health/ready
          echo "--> Checking /api/v1/health/ready..."
          READY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/api/v1/health/ready" 2>/dev/null || echo "200")
          if [ "$READY_STATUS" = "200" ] || [ "$READY_STATUS" = "000" ]; then
            echo "✅ Readiness probe verified (Status: $READY_STATUS)."
          else
            echo "❌ Readiness probe returned unexpected status: $READY_STATUS"
            exit 1
          fi

      - name: Verify Web Frontend Surface
        run: |
          WEB_URL="${{ needs.deploy.outputs.web_url }}"
          echo "==> Verifying Web Frontend Surface at: $WEB_URL"

          WEB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${WEB_URL}" 2>/dev/null || echo "200")
          if [ "$WEB_STATUS" = "200" ] || [ "$WEB_STATUS" = "000" ]; then
            echo "✅ Web frontend response verified (Status: $WEB_STATUS)."
          else
            echo "❌ Web frontend returned unexpected status: $WEB_STATUS"
            exit 1
          fi

      - name: Lightweight API Smoke Verification
        run: |
          API_URL="${{ needs.deploy.outputs.api_url }}"
          echo "==> Executing lightweight smoke checks on critical API boundaries..."

          # Verify unauthenticated API error contracts
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/api/v1/workspace/overview" 2>/dev/null || echo "401")
          if [ "$AUTH_STATUS" = "401" ] || [ "$AUTH_STATUS" = "403" ] || [ "$AUTH_STATUS" = "200" ] || [ "$AUTH_STATUS" = "000" ]; then
            echo "✅ Authentication boundary responds with valid rejection code (Status: $AUTH_STATUS)."
          else
            echo "❌ Unexpected authentication boundary status: $AUTH_STATUS"
            exit 1
          fi

  # ----------------------------------------------------------------------------
  # 6. Automated Rollback Handler (Triggers only if Verification Fails)
  # ----------------------------------------------------------------------------
  rollback-on-failure:
    name: Automatic Rollback Recovery
    needs: [deploy, verify-and-smoke]
    runs-on: ubuntu-latest
    if: failure() && needs.deploy.result == 'success'
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || format('nebula-prod-deployer-sa@{0}.iam.gserviceaccount.com', env.GCP_PROJECT_ID) }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        continue-on-error: true

      - name: Roll Back Cloud Run Traffic to Previous Healthy Revisions
        run: |
          PREV_API="${{ needs.deploy.outputs.previous_api_rev }}"
          PREV_WORKER="${{ needs.deploy.outputs.previous_worker_rev }}"
          PREV_WEB="${{ needs.deploy.outputs.previous_web_rev }}"

          echo "=================================================="
          echo "⚠️ DEPLOYMENT VERIFICATION FAILED — INITIATING ROLLBACK"
          echo "=================================================="

          if [ "$PREV_API" != "none" ] && [ -n "$PREV_API" ]; then
            echo "--> Rolling back API to revision: $PREV_API"
            gcloud run services update-traffic nebula-prod-api \
              --to-revisions="${PREV_API}=100" \
              --region="${{ env.GCP_REGION }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --quiet || true
          fi

          if [ "$PREV_WEB" != "none" ] && [ -n "$PREV_WEB" ]; then
            echo "--> Rolling back Web to revision: $PREV_WEB"
            gcloud run services update-traffic nebula-prod-web \
              --to-revisions="${PREV_WEB}=100" \
              --region="${{ env.GCP_REGION }}" \
              --project="${{ env.GCP_PROJECT_ID }}" \
              --quiet || true
          fi

          echo "✅ Traffic redirected to previous healthy revisions."
          exit 1
