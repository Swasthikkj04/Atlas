version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: atlas-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI / HTTP API

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: nebula-api:local
    container_name: atlas-api
    restart: unless-stopped
    profiles:
      - full
      - staging
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: staging
      PORT: "8080"
      DATABASE_URL: postgresql://atlas:atlas@postgres:5432/atlas?schema=public
      JWT_ACCESS_SECRET: staging-super-secret-access-token-key-32chars-minimum
      JWT_REFRESH_SECRET: staging-super-secret-refresh-token-key-32chars-minimum
      FRONTEND_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:3000,http://127.0.0.1:8080
      WORKER_ENABLED: "false"
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: atlas
      SMTP_PASS: atlas
      SMTP_SECURE: "false"
      SMTP_FROM: Nebula Intelligence <no-reply@argonion.com>
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: nebula-worker:local
    container_name: atlas-worker
    restart: unless-stopped
    profiles:
      - full
      - staging
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      NODE_ENV: staging
      PORT: "8080"
      DATABASE_URL: postgresql://atlas:atlas@postgres:5432/atlas?schema=public
      JWT_ACCESS_SECRET: staging-super-secret-access-token-key-32chars-minimum
      JWT_REFRESH_SECRET: staging-super-secret-refresh-token-key-32chars-minimum
      WORKER_ENABLED: "true"
      WORKER_MODE: standalone

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: http://localhost:8081
    image: nebula-web:local
    container_name: atlas-web
    restart: unless-stopped
    profiles:
      - full
      - staging
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  postgres_data: